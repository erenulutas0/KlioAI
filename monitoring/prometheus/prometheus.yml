global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/cache-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: backend-actuator
    metrics_path: /actuator/prometheus
    # /actuator/prometheus is not public: Spring permits only /actuator/health,
    # and everything else needs authentication. Without these credentials every
    # scrape came back 401, so `up` stayed 0 and every rule in alerts/ evaluated
    # against no data -- alerting that looked configured and saw nothing.
    #
    # The file holds the same value as APP_OPS_METRICS_SCRAPE_TOKEN in the
    # backend's environment. It is mounted from the VPS and deliberately not in
    # git; see docs/MONITORING_SCRAPE_TOKEN.md.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets:
          - backend:8082

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis-main
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          redis_instance: main

  - job_name: redis-security
    static_configs:
      - targets:
          - redis-security-exporter:9121
        labels:
          redis_instance: security
