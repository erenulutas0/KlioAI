name: Android AAB Artifact

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL baked into the release build"
        required: true
        default: "https://api.klioai.app"
      run_quality_gate:
        description: "Run Flutter quality gate before building"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  android-aab-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Flutter + Android SDK + NDK + Gradle cache birlikte runner diskini
      # doldurdu; is sonundaki "Post Setup Java" cache kaydi
      # "No space left on device" ile patlayip AAB uretilmis olmasina ragmen
      # calismayi kirmiziya cevirdi. Bu projede kullanilmayan onyuklu
      # araclari silerek ~15GB aciyoruz. Android SDK'ya DOKUNMUYORUZ.
      - name: Free runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          echo "After:"; df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately. This was `channel: stable` with no version, so every run
          # picked up whatever Flutter had released that day - and a stable release raising
          # its minimum Gradle to 8.14.0 broke the release build with no change on our side.
          # A release artifact should be reproducible: this is the version the app is
          # developed and tested against locally. Bump it on purpose, not by the calendar.
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: flutter_vocabmaster
        run: flutter pub get

      - name: Accept Android SDK Licenses And Install NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "ndk;29.0.14033849"

      - name: Flutter Quality Gate
        if: ${{ inputs.run_quality_gate == 'true' }}
        shell: pwsh
        run: pwsh -File ./scripts/flutter-quality-gate.ps1 -SkipPubGet

      - name: Prepare Android Release Signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for var_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::$var_name GitHub secret is missing."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter_vocabmaster/android/app/upload-keystore.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > flutter_vocabmaster/android/key.properties

          chmod 600 flutter_vocabmaster/android/key.properties flutter_vocabmaster/android/app/upload-keystore.jks

      # Play refuses a versionCode it has already seen, and the code in pubspec.yaml does
      # not move on its own -- every build from an unchanged tree carried the same number,
      # so a forgotten bump was only discovered after a ~50 minute build, at upload.
      #
      # The run number is monotonic per workflow, so it can never collide or go backwards.
      # The offset lifts it clear of the codes already published by hand (the highest was
      # 334); without it the first automated build would have gone backwards and Play would
      # have refused that instead.
      #
      # Only the build number is overridden. The version NAME still comes from pubspec.yaml,
      # so the human-meaningful part of the version stays under your control and in git.
      - name: Resolve version code
        id: versioncode
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 400 ))
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Build number for this run: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release AAB
        working-directory: flutter_vocabmaster
        run: |
          flutter build appbundle --release \
            --build-number=${{ steps.versioncode.outputs.value }} \
            --dart-define=BACKEND_URL="${{ inputs.backend_url }}"

      # Every device the app already reaches must still be reachable, and the 64-bit
      # libraries must stay 16 KB aligned. Those two pull against each other: the 16 KB
      # commit in May 2026 satisfied the rule by shipping only arm64-v8a, which stranded
      # every 32-bit user and got the next release refused by Play outright -- four months
      # later, at upload, with no signal in between. This asserts both at once.
      - name: Verify AAB device coverage and 16 KB alignment
        run: python ./scripts/check-aab-abis.py flutter_vocabmaster/build/app/outputs/bundle/release/app-release.aab

      # Records which commit produced which versionCode, so the mapping is not lost just
      # because the number is no longer written in the repository.
      - name: Record build identity
        run: |
          {
            echo "### Build identity"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionCode | ${{ steps.versioncode.outputs.value }} |"
            echo "| commit | ${{ github.sha }} |"
            echo "| version name | $(grep '^version:' flutter_vocabmaster/pubspec.yaml | sed 's/version: //' | cut -d+ -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Release Checklist
        shell: pwsh
        run: >
          pwsh -File ./scripts/new-release-checklist.ps1
          -OutputPath build/release-checklist.md
          -BackendUrl "${{ inputs.backend_url }}"
          -PreparedBy "GitHub Actions"
          -AndroidArtifact "app-release.aab"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klioai-release-aab
          path: flutter_vocabmaster/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release Checklist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: klioai-release-checklist
          path: build/release-checklist.md
          if-no-files-found: error
          retention-days: 30
