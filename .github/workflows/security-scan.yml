name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  # upload-sarif ozel repolarda calisma bilgisini okumak icin actions:read
  # istiyor; olmayinca "Resource not accessible by integration" ile patliyor.
  actions: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory only: dependency-review requires the GitHub Dependency Graph,
    # which needs GitHub Advanced Security on private repos. Without it the
    # action errors out (not a real finding). Actual dependency vulnerability
    # scanning is done by the required trivy-fs job below, so keep this
    # informational instead of blocking every PR with a config-only failure.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0
          cache: 'false'

      # Bulgulari ONCE insan okunur tabloyla loga bas. Sadece SARIF uretilince
      # bulgular dosyaya gidiyordu; SARIF yuklemesi de izin hatasiyla
      # basarisiz olunca bu zorunlu kapi, neyi engelledigini hic gostermeden
      # merge'u bloke ediyordu. Burada kapi yok (exit-code 0), sadece gorunurluk.
      - name: Trivy findings (human readable)
        run: >
          trivy fs
          --format table
          --pkg-types os,library
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 0
          --skip-dirs backend/src/test
          --skip-dirs backend/target
          .

      - name: Run Trivy Vulnerability Scanner
        run: >
          trivy fs
          --format sarif
          --output trivy-results.sarif
          --pkg-types os,library
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 1
          --skip-dirs backend/src/test
          --skip-dirs backend/target
          .

      # Code scanning'e yukleme ozel repolarda GitHub Advanced Security
      # istiyor (bkz. dependency-review notu). Yoksa bu adim patliyor ama
      # asil kapi yukaridaki tarama - yukleme basarisizligi merge'u
      # engellememeli, tablo zaten logda.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
