plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// ---- Load keystore properties (for release signing) ----
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.flutter_vocabmaster"
    compileSdk = 36
    ndkVersion = "29.0.14033849"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.VocabMaster"
        minSdk = 24
        // Play's floor, not a preference: uploads targeting 35 are rejected
        // with "must target at least API level 36". compileSdk was already 36,
        // so this compiles nothing new -- what it changes is the behaviour the
        // platform applies at runtime.
        //
        // The one that usually bites here is edge-to-edge, which Android 16
        // stops letting apps opt out of. This app never opted out: there is no
        // windowOptOutEdgeToEdgeEnforcement in styles.xml and none in the
        // manifest, so it has been drawing under the bars since targetSdk 35
        // and every screen already sits inside a SafeArea.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            // key.properties içindeki değerleri okur
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // ❌ debug signing kaldırıldı
            // ✅ release signing eklendi
            signingConfig signingConfigs.release

            // İstersen ileride ekleyebilirsin:
            // minifyEnabled false
            // shrinkResources false
        }
    }

    packaging {
        jniLibs {
            excludes += ["lib/armeabi-v7a/**", "lib/x86_64/**"]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
