# Production hardening: require secrets and reduce management/API surface.

# Secrets/Credentials (no fallback defaults)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.security.password=${SPRING_DATA_REDIS_SECURITY_PASSWORD}
groq.api.key=${GROQ_API_KEY}
app.ai.model-routing.enabled=true
app.ai.model-routing.default-model=openai/gpt-oss-20b
app.ai.model-routing.speech-model=openai/gpt-oss-120b
app.ai.model-routing.utility-model=openai/gpt-oss-20b
app.ai.model-routing.speech-scopes=speaking-chat,speaking-generate,speaking-evaluate,generate-sentences
groq.speech.api.url=${GROQ_SPEECH_API_URL:https://api.groq.com/openai/v1/audio/transcriptions}
groq.speech.model=${GROQ_SPEECH_MODEL:whisper-large-v3-turbo}
groq.speech.language=${GROQ_SPEECH_LANGUAGE:en}
app.ai.speech.max-audio-bytes=${APP_AI_SPEECH_MAX_AUDIO_BYTES:5242880}
app.ai.speech.max-duration-seconds=${APP_AI_SPEECH_MAX_DURATION_SECONDS:60}
app.ai.speech.min-billed-seconds=${APP_AI_SPEECH_MIN_BILLED_SECONDS:10}
app.ai.speech.tokens-per-billed-second=${APP_AI_SPEECH_TOKENS_PER_BILLED_SECOND:10}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6MB}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cors.strict-origin-validation=true

# Swagger/OpenAPI disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Health plus the Prometheus scrape. It was health alone, which meant the
# nineteen alert rules in monitoring/prometheus/alerts scraped a 404 and never
# fired -- alerting that exists in the repository and nowhere else. Only these
# two are exposed; /actuator/prometheus is not in SecurityConfig's permitAll
# list, so it stays behind auth and is not reachable from the internet.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
# Set APP_OPS_METRICS_SCRAPE_TOKEN on the VPS and put the same value in
# monitoring/prometheus/scrape-token. Empty leaves /actuator/prometheus behind
# normal auth, which returns 401 to the scrape and leaves every alert blind.
app.ops.metrics-scrape-token=${APP_OPS_METRICS_SCRAPE_TOKEN:}

# Security headers (enabled in production)
# A tiny AI call every fifteen minutes, so a Groq outage is noticed by us
# rather than reported by a learner. It was off in every profile, which left
# the operator reading docker logs as the only way to find out.
app.ops.synthetic-probe.enabled=true

app.security.headers.enabled=true
app.security.headers.hsts-enabled=true
app.security.headers.hsts-max-age-seconds=31536000
app.security.headers.hsts-include-sub-domains=true
app.security.headers.hsts-preload=false
app.security.jwt.enforce-auth=true
app.security.jwt.issuer=calismaapp
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.access-token-ttl-seconds=900
app.security.jwt.refresh-token-ttl-seconds=604800
app.security.jwt.refresh-token-remember-me-ttl-seconds=2592000
app.security.jwt.allowed-clock-skew-seconds=30
app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.redis-enabled=true
app.security.auth-rate-limit.redis-fallback-mode=memory
app.security.auth-rate-limit.redis-failure-block-seconds=60
app.security.auth-rate-limit.login-principal-max-attempts=6
app.security.auth-rate-limit.login-principal-window-seconds=300
app.security.auth-rate-limit.login-principal-block-seconds=900
app.security.auth-rate-limit.login-ip-max-attempts=30
app.security.auth-rate-limit.login-ip-window-seconds=300
app.security.auth-rate-limit.login-ip-block-seconds=900
app.security.auth-rate-limit.register-ip-max-attempts=8
app.security.auth-rate-limit.register-ip-window-seconds=600
app.security.auth-rate-limit.register-ip-block-seconds=1800
app.security.auth-rate-limit.password-reset-ip-max-attempts=4
app.security.auth-rate-limit.password-reset-ip-window-seconds=600
app.security.auth-rate-limit.password-reset-ip-block-seconds=1800
app.security.ai-rate-limit.enabled=true
app.security.ai-rate-limit.redis-enabled=true
app.security.ai-rate-limit.redis-fallback-mode=memory
app.security.ai-rate-limit.redis-failure-block-seconds=60
app.security.ai-rate-limit.user-window-max-requests=20
app.security.ai-rate-limit.ip-window-max-requests=50
app.security.ai-rate-limit.window-seconds=60
app.security.ai-rate-limit.abuse-penalty-enabled=true
app.security.ai-rate-limit.abuse-penalty-seconds=30,60,150
app.security.ai-rate-limit.abuse-strike-reset-seconds=900
app.security.ai-rate-limit.memory-max-entries-per-map=100000
app.security.ai-rate-limit.memory-cleanup-interval-seconds=30
# Token quota is the primary cost guardrail; keep request-based daily quota high enough
# to not be the limiting factor for normal usage.
app.security.ai-rate-limit.daily-quota-per-user=1000

# AI Token Quota (daily tokens per user; prompt + completion tokens)
app.security.ai-token-quota.enabled=true
app.security.ai-token-quota.redis-enabled=true
# Cost-protecting default: if Redis is down, block AI calls rather than allow unlimited spend.
app.security.ai-token-quota.redis-fallback-mode=deny
app.security.ai-token-quota.redis-failure-block-seconds=60
# Global budget across all AI features that proxy through the backend.
app.security.ai-token-quota.daily-token-quota-per-user=30000
app.security.ai-token-quota.memory-max-entries=100000
app.security.ai-token-quota.memory-cleanup-interval-seconds=30
app.security.ai-token-quota.trial-duration-days=7
app.security.ai-token-quota.trial-daily-token-quota-per-user=${APP_SECURITY_AI_TOKEN_QUOTA_TRIAL_DAILY_TOKEN_QUOTA_PER_USER:20000}
# 1,500 was less than a single generation, which costs about 1,600 tokens measured. It was
# not a limit, it was a wall: one short conversation reported "1858/1500 token" and every
# AI feature in the app went dark for the rest of the day -- including speech transcription,
# which surfaces the block as "Could not transcribe speech" and reads like a broken app
# rather than a quota.
#
# At the configured 0.10 USD per million tokens, 8,000/day is 0.024 USD per free user per
# month. The old number was saving under half a cent each in exchange for nobody being able
# to evaluate the product.
#
# Env-overridable on purpose: these were hardcoded here, so the values in
# application.properties and application-docker.properties were dead text and this file
# silently decided the real limit.
app.security.ai-token-quota.free-daily-token-quota-per-user=${APP_SECURITY_AI_TOKEN_QUOTA_FREE_DAILY_TOKEN_QUOTA_PER_USER:8000}
# Raised from 30000 on 2026-09-02. At 30k a PRO subscriber got roughly
# twenty tutor turns a day, which is not a habit -- and the ceiling was
# never the cost. Measured worst case at 100k, with every token spent on
# the expensive 120b model and an hour of speech a day, is about $1.80 a
# month against $3.75 net revenue. Typical use is a tenth of that.
app.security.ai-token-quota.premium-daily-token-quota-per-user=100000
# No product sells this today. Kept above PREMIUM so the ladder stays in
# order: at 60000 it was a tier costing more and giving less than the 100k
# PREMIUM below it, waiting to be sold by mistake.
app.security.ai-token-quota.premium-plus-daily-token-quota-per-user=250000
app.security.ai-token-quota.non-paid-aggregate-daily-token-quota-per-device=${APP_SECURITY_AI_TOKEN_QUOTA_NON_PAID_AGGREGATE_DAILY_TOKEN_QUOTA_PER_DEVICE:10000}
app.security.ai-token-quota.non-paid-aggregate-daily-token-quota-per-ip=${APP_SECURITY_AI_TOKEN_QUOTA_NON_PAID_AGGREGATE_DAILY_TOKEN_QUOTA_PER_IP:20000}
app.security.ai-token-quota.estimated-cost-usd-per-million-tokens=${APP_SECURITY_AI_TOKEN_QUOTA_ESTIMATED_COST_USD_PER_MILLION_TOKENS:0.10}
app.security.auth.password-reset-token-ttl-seconds=900
app.security.auth.email-verification-token-ttl-seconds=86400
app.security.auth.expose-debug-tokens=false
app.security.auth.email-password-enabled=false
app.security.auth.google-id-token-required=true
app.security.auth.google-client-ids=${APP_SECURITY_AUTH_GOOGLE_CLIENT_IDS}
app.security.trial-abuse.enabled=true
app.security.trial-abuse.redis-enabled=true
app.security.trial-abuse.redis-fallback-mode=deny
app.security.trial-abuse.redis-failure-block-seconds=60
app.security.trial-abuse.window-hours=24
app.security.trial-abuse.max-trial-accounts-per-device=2
# Four was written while every request appeared to come from the proxy, so it
# never bound. With CF-Connecting-IP it binds for real, and a shared exit --
# a campus, an office, carrier-grade NAT, a VPN -- puts genuine strangers
# behind one address. Twenty still stops a person farming trials by hand and
# stops treating a dormitory as one person.
app.security.trial-abuse.max-trial-accounts-per-ip=20
# Was false, which behind a proxy is a global rate limit: ClientIpResolver fell
# back to getRemoteAddr(), and every request in the world arrived from Caddy,
# so the 20k-token/day and 50-req/min PER-IP caps for non-paying users were
# shared by all of them. About a dozen free generations a day for the whole
# user base, then 429 for everyone. Measured on the live host: responses
# carry "via: 1.1 Caddy" and "server: cloudflare".
#
# CF-Connecting-IP rather than X-Forwarded-For because Cloudflare sets it
# from the connection it terminated and overwrites anything the client sent,
# so it cannot be spoofed through Cloudflare. It CAN be spoofed by anyone who
# reaches Caddy or the app port directly -- keep those closed to Cloudflare.
app.security.trust-forwarded-ip-header=true
app.security.forwarded-ip-header-name=CF-Connecting-IP
app.subscription.mock-verification-enabled=false
app.subscription.google-play.enabled=true
app.subscription.google-play.package-name=${APP_SUBSCRIPTION_GOOGLE_PLAY_PACKAGE_NAME}
app.subscription.google-play.service-account-file=${APP_SUBSCRIPTION_GOOGLE_PLAY_SERVICE_ACCOUNT_FILE}
app.subscription.google-play.token-uri=${APP_SUBSCRIPTION_GOOGLE_PLAY_TOKEN_URI:https://oauth2.googleapis.com/token}
app.subscription.google-play.publisher-api-base-url=${APP_SUBSCRIPTION_GOOGLE_PLAY_API_BASE_URL:https://androidpublisher.googleapis.com}
app.subscription.google-play.accept-grace-period=${APP_SUBSCRIPTION_GOOGLE_PLAY_ACCEPT_GRACE_PERIOD:true}
app.subscription.google-play.accept-on-hold=${APP_SUBSCRIPTION_GOOGLE_PLAY_ACCEPT_ON_HOLD:false}
# Production billing truth: honor Google's expiryTime exactly (no 30-day floor).
# Override to false via env only when running Play license-tester smoke tests,
# whose purchases expire within minutes.
app.subscription.google-play.trust-verified-expiry=${APP_SUBSCRIPTION_GOOGLE_PLAY_TRUST_VERIFIED_EXPIRY:true}
app.subscription.google-play.access-token-skew-seconds=${APP_SUBSCRIPTION_GOOGLE_PLAY_ACCESS_TOKEN_SKEW_SECONDS:60}
app.subscription.google-play.reconciliation.enabled=${APP_SUBSCRIPTION_GOOGLE_PLAY_RECONCILIATION_ENABLED:true}
app.subscription.google-play.reconciliation.cron=${APP_SUBSCRIPTION_GOOGLE_PLAY_RECONCILIATION_CRON:0 */30 * * * *}
app.subscription.google-play.reconciliation.max-users-per-run=${APP_SUBSCRIPTION_GOOGLE_PLAY_RECONCILIATION_MAX_USERS_PER_RUN:200}
app.subscription.google-play.rtdn.enabled=${APP_SUBSCRIPTION_GOOGLE_PLAY_RTDN_ENABLED:false}
app.subscription.google-play.rtdn.shared-secret=${APP_SUBSCRIPTION_GOOGLE_PLAY_RTDN_SHARED_SECRET:}
app.subscription.google-play.product-plan-map.pro_monthly_subscription=${APP_SUBSCRIPTION_GOOGLE_PLAY_PRODUCT_PLAN_PRO_MONTHLY:PREMIUM}
app.subscription.google-play.product-plan-map.pro_annual_subscription=${APP_SUBSCRIPTION_GOOGLE_PLAY_PRODUCT_PLAN_PRO_ANNUAL:PREMIUM_PLUS}
app.subscription.google-play.product-plan-map.premium_monthly=${APP_SUBSCRIPTION_GOOGLE_PLAY_PRODUCT_PLAN_PREMIUM_MONTHLY:PREMIUM}
app.subscription.google-play.product-plan-map.premium_plus_monthly=${APP_SUBSCRIPTION_GOOGLE_PLAY_PRODUCT_PLAN_PREMIUM_PLUS_MONTHLY:PREMIUM_PLUS}
app.subscription.google-play.product-plan-map.monthly=${APP_SUBSCRIPTION_GOOGLE_PLAY_PRODUCT_PLAN_MONTHLY:PREMIUM}
cache.dictionary.ttl=${CACHE_DICTIONARY_TTL:86400}
