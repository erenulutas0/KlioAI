# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
# Disable Flyway for tests to avoid validation failures on in-memory DB
spring.flyway.enabled=false

# Groq AI Mock for Tests
groq.api.key=mock-key
groq.api.url=http://mock-url
groq.api.model=mock-model
app.socketio.enabled=false
app.features.community.enabled=false
app.security.jwt.enforce-auth=false
app.security.jwt.secret=test-only-jwt-secret-test-only-jwt-secret
app.security.auth.expose-debug-tokens=true

# Redis Mock for Tests (Disable or use local if needed)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# iyzico Config for Tests
iyzico.api.key=test-key
iyzico.api.secret=test-secret
iyzico.api.base.url=http://mock-iyzico

# Keep test output focused on assertion failures.
logging.level.root=WARN
logging.level.org.springframework.web=ERROR

# The auth rate limiter prefers Redis when it can reach one, and these tests point at
# localhost:6379 - the developer's own Docker Compose stack. Its counters outlive the JVM,
# so running the suite a few times in a row exhausted the password-reset and
# email-verification quotas and two tests began failing with 429 on an unchanged tree. A
# test that only passes if you have not run it recently is worse than no test. The
# in-memory limiter is the same logic and resets with the JVM.
app.security.auth-rate-limit.redis-enabled=false
